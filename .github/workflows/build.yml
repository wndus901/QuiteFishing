name: Build Minecraft 1.21.10

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build mod JARs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and NeoForge mods
        run: ./gradlew --no-daemon clean build

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: quitefishing-minecraft-1.21.10
          path: |
            fabric/build/libs/*-fabric-*.jar
            neoforge/build/libs/*-neoforge-*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar
          if-no-files-found: error
          retention-days: 14
